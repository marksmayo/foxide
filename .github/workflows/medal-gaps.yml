name: Native playback controls
on:
  workflow_dispatch:
  push:
    branches: [perf/medal-gap-improvements]
    paths:
      - 'crates/player-ui/**'
      - 'crates/player-render/**'
      - '.github/workflows/medal-gaps.yml'
  pull_request:
    paths:
      - 'crates/player-ui/**'
      - 'crates/player-render/**'
      - '.github/workflows/medal-gaps.yml'
permissions:
  contents: read
concurrency:
  group: native-controls-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FOXIDE_MPV: /usr/bin/mpv
      FOXIDE_LIBMPV: libmpv.so.2
      FOXIDE_CONTROL_FIXTURE: ${{ github.workspace }}/results/local/control-probe.mp4
      FOXIDE_SYSTEM_MEDIA_FIXTURE: ${{ github.workspace }}/results/local/system-media-metadata.mp4
      FOXIDE_AUDIO_VISUALIZATION_FIXTURE: ${{ github.workspace }}/results/local/audio-visualization.wav
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: desktop-ui
      - name: Install native playback dependencies
        run: sudo apt-get update && sudo apt-get install -y mpv libmpv2 ffmpeg xvfb libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libegl1-mesa-dev libudev-dev
      - name: Generate deterministic video with audio
        run: |
          mkdir -p results/local
          ffmpeg -v error -f lavfi -i testsrc2=size=128x72:rate=30:duration=10 -f lavfi -i sine=frequency=440:duration=10 -metadata title="Foxide system media fixture" -metadata artist="Foxide CI" -metadata album="System media controls" -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest "$FOXIDE_CONTROL_FIXTURE"
          cp "$FOXIDE_CONTROL_FIXTURE" "$FOXIDE_SYSTEM_MEDIA_FIXTURE"
          ffmpeg -v error -f lavfi -i "aevalsrc=0.6*sin(2*PI*(220*t+35*t*t)):s=44100:d=5" -c:a pcm_s16le "$FOXIDE_AUDIO_VISUALIZATION_FIXTURE"
      - name: Verify immutable snapshot sharing
        run: cargo test -p player-render --features desktop --lib --locked cloning_snapshot
      - name: Verify native metadata reaches player snapshots
        run: cargo test -p player-render --features system-media-integration --lib --locked native_snapshot_exposes_embedded_track_metadata -- --ignored --nocapture
      - name: Verify native audio visualization filter while playback advances
        run: cargo test -p player-render --features system-media-integration --lib --locked native_audio_visualization_filter_processes_audio_without_stopping_playback -- --ignored --nocapture
      - name: Verify audio waveform reaches the desktop compositor
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s '-screen 0 1280x720x24' cargo test -p player-render --features gpu-integration,system-media-integration --lib --locked audio_visualization_renders_changing_waveform_pixels -- --ignored --nocapture
      - name: Verify desktop menu commands on the native engine
        run: cargo test -p player-ui --features native-controls --lib --locked desktop_menu_commands -- --ignored --nocapture
