name: Native playback controls
on:
  workflow_dispatch:
  push:
    branches: [perf/medal-gap-improvements]
    paths:
      - 'crates/player-ui/**'
      - 'crates/player-render/**'
      - '.github/workflows/medal-gaps.yml'
  pull_request:
    paths:
      - 'crates/player-ui/**'
      - 'crates/player-render/**'
      - '.github/workflows/medal-gaps.yml'
permissions:
  contents: read
concurrency:
  group: native-controls-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      FOXIDE_MPV: /usr/bin/mpv
      FOXIDE_CONTROL_FIXTURE: ${{ github.workspace }}/results/local/control-probe.mp4
      FOXIDE_SYSTEM_MEDIA_FIXTURE: ${{ github.workspace }}/results/local/system-media-metadata.mp4
      FOXIDE_GAPLESS_FIRST: ${{ github.workspace }}/results/local/gapless-first.wav
      FOXIDE_GAPLESS_SECOND: ${{ github.workspace }}/results/local/gapless-second.wav
      FOXIDE_GAPLESS_CAPTURE: ${{ github.workspace }}/results/local/gapless-capture.wav
      FOXIDE_GAPLESS_PULSE_SINK: foxide_gapless
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: desktop-ui
      - name: Install native playback dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mpv libmpv2 ffmpeg pulseaudio pulseaudio-utils libfontconfig1-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libudev-dev
      - name: Generate deterministic video with audio
        run: |
          mkdir -p results/local
          ffmpeg -v error -f lavfi -i testsrc2=size=128x72:rate=30:duration=10 -f lavfi -i sine=frequency=440:duration=10 -metadata title="Foxide system media fixture" -metadata artist="Foxide CI" -metadata album="System media controls" -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest "$FOXIDE_CONTROL_FIXTURE"
          cp "$FOXIDE_CONTROL_FIXTURE" "$FOXIDE_SYSTEM_MEDIA_FIXTURE"
          ffmpeg -v error -f lavfi -i sine=frequency=440:duration=2 -c:a pcm_s16le "$FOXIDE_GAPLESS_FIRST"
          ffmpeg -v error -f lavfi -i sine=frequency=880:duration=2 -c:a pcm_s16le "$FOXIDE_GAPLESS_SECOND"
      - name: Start isolated PulseAudio loopback sink
        run: |
          pulseaudio --start --exit-idle-time=-1 --log-level=error
          pactl load-module module-null-sink sink_name="$FOXIDE_GAPLESS_PULSE_SINK" rate=44100 channels=1
          pactl list short sinks
      - name: Verify immutable snapshot sharing
        run: cargo test -p player-render --features desktop --lib --locked cloning_snapshot
      - name: Verify native metadata reaches player snapshots
        run: cargo test -p player-render --features system-media-integration --lib --locked native_snapshot_exposes_embedded_track_metadata -- --ignored --nocapture
      - name: Verify native playlist advances to the queued audio track
        run: cargo test -p player-render --features system-media-integration --lib --locked native_playlist_advances_to_the_queued_audio_track -- --ignored --nocapture
      - name: Verify queued audio output has no silent track boundary
        run: cargo test -p player-render --features system-media-integration --lib --locked native_playlist_pcm_capture_has_no_silence_at_track_boundary -- --ignored --nocapture
      - name: Verify gapless playback through the PulseAudio monitor
        run: cargo test -p player-render --features system-media-integration --lib --locked native_playlist_audio_device_loopback_has_no_silence_at_track_boundary -- --ignored --nocapture
      - name: Verify desktop menu commands on the native engine
        run: cargo test -p player-ui --features native-controls --lib --locked desktop_menu_commands -- --ignored --nocapture
