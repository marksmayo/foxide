name: Desktop UI build and preview
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: desktop-ui
      - name: Linux window toolkit prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libfontconfig1-dev libwayland-dev libegl1-mesa-dev
      - run: cargo build -p player-ui --features desktop --bin foxide-desktop --release --locked
      - name: Reject invalid explicit ANGLE runtimes before opening a window
        shell: bash
        run: |
          FOXIDE_DESKTOP_TEST_BINARY="$GITHUB_WORKSPACE/target/release/foxide-desktop${{ runner.os == 'Windows' && '.exe' || '' }}" python -m unittest discover -s tests -p test_angle_runtime.py
      - name: Verify desktop state refresh without a native display
        run: cargo test -p player-ui --features desktop --bin foxide-desktop --locked
      - name: Verify cached video layers see each published frame
        run: cargo test -p player-ui -p player-render --features player-ui/desktop,player-render/gpu-integration --lib --locked publishing_a_new_frame
      - name: Render actual Slint layout without a native display
        shell: bash
        run: |
          mkdir -p results/local
          ./target/release/foxide-desktop --preview-png results/local/foxide-ui-preview.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-ui-${{ runner.os }}
          path: |
            target/release/foxide-desktop*
            results/local/foxide-ui-preview.png
