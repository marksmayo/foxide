name: Code checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  rust-and-sampler:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: python -m unittest discover -s tests -v
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Enforce Rust workspace line coverage
        run: cargo llvm-cov --workspace --locked --fail-under-lines 90 --json --summary-only --output-path results/local/coverage-rust.json
      - name: Enforce medal policy and report coverage
        shell: bash
        run: |
          python -m pip install coverage==7.17.3
          python -m coverage run --branch --source=medal_events,build_medal_report,event_benchmarks --data-file=results/local/.coverage-medals -m unittest discover -s tests
          python -m coverage report --data-file=results/local/.coverage-medals --fail-under=90
          python -m coverage json --data-file=results/local/.coverage-medals -o results/local/coverage-medals.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ runner.os }}
          path: results/local/coverage-*.json
      - run: cargo build --workspace --release --locked
