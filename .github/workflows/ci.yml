name: Code checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: code-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust-and-sampler:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: checks
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: taiki-e/install-action@c2e5d2ce8920c881761c4cabb41434daa1f95687 # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Enforce Rust workspace line coverage
        run: cargo llvm-cov --workspace --locked --fail-under-lines 90 --json --summary-only --output-path results/local/coverage-rust.json
      - name: Enforce policy coverage and report coverage for every Python script
        shell: bash
        run: |
          python -m pip install coverage==7.17.3
          python -m coverage run --branch --source=scripts --data-file=results/local/.coverage-medals -m unittest discover -s tests
          python -m coverage report --data-file=results/local/.coverage-medals --include="*/medal_events.py,*/build_medal_report.py,*/event_benchmarks.py,*/collection_io.py,*/ui_benchmarks.py,*/refresh_scoreboards.py,*/publication.py" --fail-under=90
          python -m coverage report --data-file=results/local/.coverage-medals --include="*/install-mpv.py,*/install-libmpv.py" --fail-under=90
          python -m coverage report --data-file=results/local/.coverage-medals
          python -m coverage json --data-file=results/local/.coverage-medals -o results/local/coverage-medals.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-${{ runner.os }}
          path: results/local/coverage-*.json
      - run: cargo build --workspace --release --locked
