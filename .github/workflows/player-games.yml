name: Player Games
on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [main, 'bench/**']
    paths:
      - '.github/workflows/player-games.yml'
      - 'scripts/run_event_benchmarks.py'
      - 'scripts/event_benchmarks.py'
      - 'scripts/build_medal_report.py'
      - 'scripts/medal_events.py'
      - 'scripts/refresh_scoreboards.py'
      - 'scripts/prepare-event-media.py'
      - 'benchmarks/features.json'
      - 'benchmarks/performance-events.json'
      - 'benchmarks/ui-events.json'
      - 'scripts/ui_benchmarks.py'
      - 'scripts/ui_drivers.py'
      - 'scripts/run_ui_benchmarks.py'
permissions:
  contents: read
concurrency:
  group: player-games-${{ github.ref }}
  cancel-in-progress: true
jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: playback-release
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Cache verified mpv archive downloads
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/downloads
          key: mpv-archive-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('benchmarks/mpv-windows.json') }}
      - name: Install the Windows field
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/bootstrap-winget-ci.ps1
          python scripts/install-mpv.py --output results/local/games/mpv-installation.json
          if ($LASTEXITCODE -ne 0) { throw 'mpv failed verification' }
          python scripts/install-players.py --install --output results/local/games/player-installation.json
          if ($LASTEXITCODE -ne 0) { Write-Output '::warning::Some optional players need native Store/installer setup. Recorded as unavailable.' }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            winget install --exact --id Gyan.FFmpeg --source winget --silent --disable-interactivity --accept-source-agreements --accept-package-agreements
            if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed' }
          }
          (Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Links') >> $env:GITHUB_PATH
          (Join-Path $env:ProgramFiles 'WinGet\Links') >> $env:GITHUB_PATH
          exit 0
      - name: Install the macOS field
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install mpv ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
          brew install --cask vlc iina
          mkdir -p results/local/games
          for player in kodi plex smplayer foobar2000; do
            if ! brew install --cask "$player" >> results/local/games/optional-installations.log 2>&1; then
              echo "::warning::$player cask unavailable; runtime inventory will show its outcome."
            fi
          done
          brew list --versions > results/local/games/brew-versions.txt
          echo 'Infuse requires an authorized App Store installation on a self-hosted Mac.' >> results/local/games/optional-installations.log
      - name: Install the Linux field
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y mpv vlc ffmpeg xvfb
          mkdir -p results/local/games
          for player in smplayer kodi; do
            if ! sudo apt-get install -y "$player" >> results/local/games/optional-installations.log 2>&1; then
              echo "::warning::$player package unavailable; runtime inventory will show its outcome."
            fi
          done
          dpkg-query -W > results/local/games/packages.txt
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked
      - name: Identify the exact media tool build
        id: media-tools
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, os, subprocess
          versions = b''.join(subprocess.check_output([tool, '-version']) for tool in ('ffmpeg', 'ffprobe'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('sha=' + hashlib.sha256(versions).hexdigest() + '\n')
          PY
      - name: Cache verified deterministic media
        id: media-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            media/generated/games-seed
            media/generated/games
          key: games-media-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.media-tools.outputs.sha }}-${{ hashFiles('scripts/generate-media.py', 'scripts/prepare-event-media.py') }}
      - name: Generate deterministic seed corpus on a cache miss
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: python scripts/generate-media.py --profile smoke --seconds 3 --files A B C D --output media/generated/games-seed
      - name: Verify every seed, including restored seeds
        run: python scripts/generate-media.py --verify-only --output media/generated/games-seed
      - name: Extend matched bitstreams on a cache miss
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: python scripts/prepare-event-media.py --seed media/generated/games-seed --output media/generated/games
      - name: Verify extended media before benchmarking
        run: python scripts/prepare-event-media.py --verify-only --seed media/generated/games-seed --output media/generated/games
      - name: Benchmark Windows and macOS native fields
        if: runner.os != 'Linux'
        run: python scripts/run_event_benchmarks.py --media-dir media/generated/games --output results/local/games --require-core
      - name: Benchmark the Linux native field
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/run_event_benchmarks.py --media-dir media/generated/games --output results/local/games --require-core
      - name: Render this platform report
        if: always()
        shell: bash
        run: |
          if [[ -f results/local/games/measurements.json ]]; then
            python scripts/build_medal_report.py --measurements results/local/games/measurements.json --sessions results/local/games/session.json --output results/local/games/report
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: player-games-${{ runner.os }}-${{ runner.arch }}
          path: |
            results/local/games/
            media/generated/games/manifest.json
            media/generated/games-seed/manifest.json
          if-no-files-found: warn
  native-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      QT_LINUX_ACCESSIBILITY_ALWAYS_ON: '1'
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: hosted-native-ui-release
      - name: Install isolated desktop and native accessibility adapters
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv2 libxkbcommon-dev libwayland-dev libfontconfig1-dev libudev-dev libdbus-1-dev xvfb xauth openbox dbus-x11 at-spi2-core python3-pyatspi vlc smplayer
      - name: Build release desktop
        run: cargo build -p player-ui --features desktop --bin foxide-desktop --release --locked
      - name: Collect real UI actions in an isolated desktop session
        shell: bash
        run: |
          dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24 -dpi 96' bash -e -c '
            dbus-update-activation-environment DISPLAY XAUTHORITY
            busctl --user set-property org.a11y.Bus /org/a11y/bus org.a11y.Status IsEnabled b true
            busctl --user set-property org.a11y.Bus /org/a11y/bus org.a11y.Status ScreenReaderEnabled b true
            busctl --user get-property org.a11y.Bus /org/a11y/bus org.a11y.Status IsEnabled
            openbox > /tmp/foxide-openbox.log 2>&1 &
            /usr/bin/python3 scripts/run_ui_benchmarks.py --execute --require-comparable --players foxide vlc smplayer --repeats 10 --environment-label "Hosted Ubuntu X11 1920x1080 DPI96 C.UTF-8 Openbox accessibility-enabled application-default theme/window" --output results/local/ui-actions
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: player-games-ui-Linux
          path: results/local/ui-actions/
          if-no-files-found: warn
  report:
    needs: [benchmark, native-ui]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: player-games-*
          path: results/local/platforms
      - name: Generate all platform graphs and README tables
        shell: bash
        run: |
          shopt -s globstar nullglob
          files=(results/local/platforms/**/measurements.json)
          sessions=(results/local/platforms/**/session.json)
          python scripts/refresh_scoreboards.py --platform-dir results/local/platforms --output docs/scoreboards --readme README.md
          cat docs/scoreboards/scoreboards.md >> "$GITHUB_STEP_SUMMARY"
      - name: Verify the rendered report and platform navigation
        shell: bash
        run: |
          mkdir -p results/local/report-qa
          google-chrome --headless --no-first-run --no-default-browser-check --user-data-dir="$RUNNER_TEMP/foxide-report-preview" --window-size=1600,1500 --virtual-time-budget=1500 --screenshot="$GITHUB_WORKSPACE/results/local/report-qa/preview.png" "file://$GITHUB_WORKSPACE/docs/scoreboards/report.html"
          google-chrome --headless --no-first-run --no-default-browser-check --user-data-dir="$RUNNER_TEMP/foxide-report-navigation" --virtual-time-budget=1500 --dump-dom "file://$GITHUB_WORKSPACE/docs/scoreboards/report.html#macos" > results/local/report-qa/macos-dom.html
          python - <<'PY'
          from pathlib import Path
          import re
          page = Path('results/local/report-qa/macos-dom.html').read_text('utf-8')
          active = re.search(r'<section[^>]*id="macos"[^>]*>', page).group()
          assert 'hidden' not in active, 'Platform navigation did not activate macOS'
          assert page.count('<svg ') == 3, 'Expected three embedded platform graphs'
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: foxide-player-games-report
          path: |
            docs/scoreboards/
            results/local/report-qa/
      - name: Update the benchmark branch scoreboards for PR review
        if: startsWith(github.ref, 'refs/heads/bench/') || github.ref == 'refs/heads/fix/security-and-test-gaps'
        shell: bash
        run: |
          branch="$GITHUB_REF_NAME"
          git fetch origin "$branch"
          if [[ "$(git rev-parse "origin/$branch")" != "$GITHUB_SHA" ]]; then
            echo 'A newer source commit exists; keep this run as an artifact without overwriting current scoreboards.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/scoreboards benchmarks/results
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update Player Games platform scores and graphs'
          git push origin "HEAD:$branch"
