name: Windows release packaging
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag on main (for example v0.0.1-preview.1)
        required: true
        type: string
  pull_request:
    paths:
      - '.github/workflows/windows-release.yml'
      - 'packaging/**'
      - 'scripts/package_windows.py'
      - 'tests/test_package_windows.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
permissions:
  contents: read
concurrency:
  group: windows-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    env:
      REQUESTED_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: windows-release
          cache-on-failure: true
      - name: Resolve and validate the release source
        id: version
        shell: python
        run: |
          import os, re, subprocess, tomllib
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          tag = ''
          if os.environ['GITHUB_EVENT_NAME'] != 'pull_request':
              tag = os.environ['REQUESTED_TAG'] if os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch' else os.environ['GITHUB_REF_NAME']
              if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?', tag):
                  raise ValueError('Expected a version tag')
              subprocess.run(['git', 'checkout', '--detach', 'refs/tags/' + tag], check=True)
              subprocess.run(['git', 'merge-base', '--is-ancestor', 'HEAD', 'origin/main'], check=True)
          version = tag[1:] if tag else tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version'] + '-preview.ci'
          base = tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version']
          if version.split('-')[0] != base:
              raise ValueError('Tag version must match workspace.package.version')
          commit = git('rev-parse', 'HEAD')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\nversion={version}\ncommit={commit}\n')
      - name: Test and build the Windows desktop
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -m unittest discover -s tests -p test_package_windows.py
          if ($LASTEXITCODE -ne 0) { throw 'Packaging tests failed' }
          cargo test --workspace --locked
          if ($LASTEXITCODE -ne 0) { throw 'Workspace tests failed' }
          $env:FOXIDE_RELEASE_VERSION = $env:RELEASE_VERSION
          cargo build -p player-ui --features desktop --bin foxide-desktop --release --locked
          if ($LASTEXITCODE -ne 0) { throw 'Desktop build failed' }
          cargo metadata --locked --format-version 1 --filter-platform x86_64-pc-windows-msvc --features player-ui/desktop > cargo-release-metadata.json
          if ($LASTEXITCODE -ne 0) { throw 'Dependency metadata collection failed' }
      - name: Assemble Windows package and checksums
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          python scripts/package_windows.py --binary target/release/foxide-desktop.exe --metadata cargo-release-metadata.json --output dist --version $env:RELEASE_VERSION --commit $env:RELEASE_COMMIT
          if ($LASTEXITCODE -ne 0) { throw 'Package assembly failed' }
          git archive --format=zip --output=dist/Foxide-source.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          $hash = (Get-FileHash dist/Foxide-source.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Foxide-source.zip" | Add-Content dist/SHA256SUMS.txt
      - name: Build and smoke-test the Windows installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $zip = @(Get-ChildItem dist/Foxide-*-windows-x64.zip)
          if ($zip.Count -ne 1) { throw 'Expected exactly one Windows ZIP package' }
          $payloadRoot = Join-Path $PWD 'results/local/installer-payload'
          Expand-Archive -LiteralPath $zip[0].FullName -DestinationPath $payloadRoot
          $payload = @(Get-ChildItem -LiteralPath $payloadRoot -Directory)
          if ($payload.Count -ne 1) { throw 'Expected one extracted installer payload' }
          $iscc = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) { throw 'Inno Setup 6 compiler is missing from the Windows runner' }
          & $iscc "/DAppVersion=$env:RELEASE_VERSION" "/DPayloadDir=$($payload[0].FullName)" packaging/Foxide.iss
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer compilation failed' }
          $installer = @(Get-ChildItem dist/Foxide-*-windows-x64-setup.exe)
          if ($installer.Count -ne 1) { throw 'Expected one Windows setup installer' }
          $installerHash = (Get-FileHash -LiteralPath $installer[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$installerHash  $($installer[0].Name)" | Add-Content dist/SHA256SUMS.txt
          $resultsDirectory = (Resolve-Path results/local).Path
          $installDir = Join-Path $resultsDirectory 'installer-smoke'
          $installerLog = Join-Path $resultsDirectory 'installer-smoke.log'
          & $installer[0].FullName /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /NOICONS "/DIR=$installDir" "/LOG=$installerLog"
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer smoke install failed' }
          foreach ($file in @('Foxide.exe', 'Install-PlaybackRuntime.ps1', 'BUILD-INFO.json')) {
            if (-not (Test-Path -LiteralPath (Join-Path $installDir $file))) {
              Write-Host "Installer expected destination: $installDir"
              if (Test-Path -LiteralPath $installDir) {
                Get-ChildItem -LiteralPath $installDir -Force -Recurse | Select-Object -First 80 -ExpandProperty FullName
              } else {
                Write-Host 'Expected install directory was not created.'
              }
              $installedExecutables = @(Get-ChildItem -LiteralPath $resultsDirectory -Filter 'Foxide.exe' -File -Recurse -ErrorAction SilentlyContinue)
              if ($installedExecutables.Count -gt 0) {
                Write-Host 'Found the executable elsewhere under results/local:'
                $installedExecutables | Select-Object -ExpandProperty FullName
              }
              if (Test-Path -LiteralPath $installerLog) {
                Get-Content -LiteralPath $installerLog -Tail 100
              }
              throw "Installed payload missing $file"
            }
          }
          $uninstaller = Join-Path $installDir 'unins000.exe'
          if (-not (Test-Path -LiteralPath $uninstaller)) { throw 'Installed uninstaller is missing' }
          & $uninstaller /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer smoke uninstall failed' }
          if (Test-Path -LiteralPath (Join-Path $installDir 'Foxide.exe')) { throw 'Installer uninstall left Foxide.exe behind' }
      - name: Verify the extracted package layout
        shell: pwsh
        run: |
          $zip = @(Get-ChildItem dist/Foxide-*-windows-x64.zip)
          if ($zip.Count -ne 1) { throw 'Expected exactly one Windows package' }
          Expand-Archive -LiteralPath $zip[0].FullName -DestinationPath results/local/release-extracted
          $exe = @(Get-ChildItem results/local/release-extracted -Recurse -Filter Foxide.exe)
          if ($exe.Count -ne 1) { throw 'Packaged executable missing' }
          & $exe[0].FullName --preview-png results/local/release-preview.png
          if ($LASTEXITCODE -ne 0) { throw 'Packaged executable preview failed' }
          if (-not (Test-Path results/local/release-preview.png)) { throw 'No preview image produced' }
          & (Join-Path $exe[0].DirectoryName 'Install-PlaybackRuntime.ps1')
          if ($LASTEXITCODE -ne 0) { throw 'Packaged runtime setup failed' }
          $env:FOXIDE_RELEASE_TEST_DLL = Join-Path $exe[0].DirectoryName 'tools/libmpv/libmpv-2.dll'
          python -c "import ctypes,os; dll=ctypes.WinDLL(os.environ['FOXIDE_RELEASE_TEST_DLL'], winmode=0x1000); version=dll.mpv_client_api_version; version.restype=ctypes.c_ulong; assert version() >> 16 == 2, 'Expected libmpv client ABI2'"
          if ($LASTEXITCODE -ne 0) { throw 'Installed playback runtime did not load with ABI2' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release-package
          path: |
            dist/
            results/local/release-preview.png
          if-no-files-found: error
  draft-release:
    if: github.event_name != 'pull_request'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release-package
          path: package
      - name: Create or update a draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
        run: |
          set -euo pipefail
          cd package/dist
          if state=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$state" != "true" ]]; then
              echo "Refusing to replace assets of an already-published release."
              exit 1
            fi
          else
            flags=(--verify-tag --draft)
            if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${flags[@]}" --title "Foxide $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" ./*.zip ./*.exe SHA256SUMS.txt BUILD-INFO.json --clobber
