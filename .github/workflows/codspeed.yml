name: CodSpeed
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codspeed-${{ github.ref }}
  cancel-in-progress: true
jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: codspeed
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-codspeed@6.0.0
      - name: Validate every benchmark case and record the expanded inventory
        shell: bash
        run: |
          mkdir -p results/local
          cargo bench --workspace --benches --locked -- --test 2>&1 | tee results/local/codspeed-benchmarks.txt
      - name: Record benchmark inventory
        shell: bash
        run: |
          echo '## Registered CPU benchmarks' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat results/local/codspeed-benchmarks.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Build the benchmark targets
        run: cargo codspeed build -m simulation
      - name: Run the benchmarks
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5
        with:
          mode: simulation
          run: cargo codspeed run
      - name: Upload benchmark inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codspeed-benchmark-inventory
          path: results/local/codspeed-benchmarks.txt
          if-no-files-found: warn
