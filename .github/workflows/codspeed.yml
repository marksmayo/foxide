name: CodSpeed
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codspeed-${{ github.ref }}
  cancel-in-progress: true
jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: '1.100.0'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: codspeed-ubuntu24-rust1100
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-codspeed@6.0.0
      - name: Record the benchmark environment
        shell: python
        run: |
          import json, os, platform, subprocess
          from pathlib import Path
          def version(command):
              return subprocess.check_output(command, text=True).splitlines()[0]
          output = Path('results/local/codspeed-environment.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps({'runner_image': os.environ.get('ImageOS'), 'runner_image_version': os.environ.get('ImageVersion'), 'architecture': platform.machine(), 'libc': platform.libc_ver(), 'rustc': version(['rustc', '--version']), 'cargo': version(['cargo', '--version'])}, indent=2), encoding='utf-8')
      - name: Validate every benchmark case and record the expanded inventory
        shell: bash
        run: |
          mkdir -p results/local
          cargo bench --workspace --benches --locked -- --test 2>&1 | tee results/local/codspeed-benchmarks.txt
      - name: Record benchmark inventory
        shell: bash
        run: |
          echo '## Registered CPU benchmarks' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat results/local/codspeed-benchmarks.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Build the benchmark targets
        run: cargo codspeed build -m simulation
      - name: Run the benchmarks
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5
        with:
          mode: simulation
          run: cargo codspeed run
      - name: Upload benchmark inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codspeed-benchmark-inventory
          path: |
            results/local/codspeed-benchmarks.txt
            results/local/codspeed-environment.json
          if-no-files-found: warn
