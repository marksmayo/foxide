[package]
name = "player-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
player-core.workspace = true
player-services = { path = "../player-services", optional = true }
player-settings = { path = "../player-settings", optional = true }
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility", "compat-1-18"], optional = true }
player-render = { path = "../player-render", features = ["desktop"], optional = true }
serde_json = { workspace = true, optional = true }
rfd = { version = "0.15", optional = true }
futures-lite = { version = "2", optional = true }
clap = { workspace = true, optional = true }
image = { version = "0.25", default-features = false, features = ["png", "webp"], optional = true }

[features]
native-controls = ["desktop"]
desktop = ["dep:player-services", "dep:player-settings", "dep:slint", "dep:slint-build", "dep:player-render", "dep:serde_json", "dep:rfd", "dep:futures-lite", "dep:clap", "dep:image"]

[build-dependencies]
slint-build = { version = "=1.18.1", optional = true }

[[bin]]
name = "foxide-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"

[dev-dependencies]
divan = { version = "6.0.0", package = "codspeed-divan-compat" }

[[bench]]
name = "shortcuts"
harness = false

[[bench]]
name = "actions"
harness = false
