[package]
name = "player-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
video-site-integration = ["desktop"]
gpu-integration = ["desktop", "slint/backend-winit", "slint/renderer-femtovg", "slint/renderer-software"]
desktop = ["dep:player-services", "dep:slint", "dep:glow", "dep:libloading", "dep:serde_json"]

[dependencies]
player-services = { path = "../player-services", optional = true }
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18"], optional = true }
glow = { version = "0.16", optional = true }
libloading = { version = "0.8", optional = true }
serde_json = { workspace = true, optional = true }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[[test]]
name = "artwork_compositor"
required-features = ["gpu-integration"]

[[test]]
name = "shader_compositor"
required-features = ["gpu-integration"]
