[package]
name = "player-cast"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
player-services = { path = "../player-services" }
serde_json.workspace = true
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "=0.10.9"
getrandom = "=0.3.4"
mio = { version = "=1.2.5", features = ["os-poll", "net"] }
mdns-sd = { version = "=0.22.0", default-features = false }

[features]
device-integration = []

[dev-dependencies]
rcgen = { version = "=0.14.5", default-features = false, features = ["ring", "crypto"] }

[lints]
workspace = true
